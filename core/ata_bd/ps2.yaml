project: ata_bd

targets:
  - name: ata_bd
    type: iop
    linkfile: ../startup/share/iop/linkfile
    sources:
      - ../atad/src/ps2atad.c
    imports_lst: ../atad/src/imports.lst
    exports_tab: ../atad/src/exports.tab
    defines:
      - ATA_ENABLE_BDM=1
      - ATA_GAMESTAR_WORKAROUND=1
      - ATA_USE_DEV9=1
    include_dirs:
      - ../atad/include
      - ../atad/src
      - ../bdm/include
      - ../dev9/include
      - ../loadcore/include
      - ../stdio/include
      - ../sysclib/include
      - ../threadman/include
